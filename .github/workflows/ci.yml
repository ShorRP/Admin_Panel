name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - run: echo static

  e2e:
    name: End to end (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - run: echo shard ${{ matrix.shard }}
      - run: sleep 120
        if: matrix.shard == '3/6'
  check:
    name: Check
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      STATIC: ${{ needs.static.result }}
      E2E: ${{ needs.e2e.result }}
    steps:
      - run: |
          echo "static: $STATIC"
          echo "end to end: $E2E"
          test "$STATIC" = success
          test "$E2E" = success
