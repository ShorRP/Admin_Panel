name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:comments

      - run: pnpm check:context-budget

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  e2e:
    name: End to end ${{ matrix.config }} (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: "4x2", shard: "1/4", workers: 2 }
          - { config: "4x2", shard: "2/4", workers: 2 }
          - { config: "4x2", shard: "3/4", workers: 2 }
          - { config: "4x2", shard: "4/4", workers: 2 }
          - { config: "4x4", shard: "1/4", workers: 4 }
          - { config: "4x4", shard: "2/4", workers: 4 }
          - { config: "4x4", shard: "3/4", workers: 4 }
          - { config: "4x4", shard: "4/4", workers: 4 }
          - { config: "6x2", shard: "1/6", workers: 2 }
          - { config: "6x2", shard: "2/6", workers: 2 }
          - { config: "6x2", shard: "3/6", workers: 2 }
          - { config: "6x2", shard: "4/6", workers: 2 }
          - { config: "6x2", shard: "5/6", workers: 2 }
          - { config: "6x2", shard: "6/6", workers: 2 }
          - { config: "8x2", shard: "1/8", workers: 2 }
          - { config: "8x2", shard: "2/8", workers: 2 }
          - { config: "8x2", shard: "3/8", workers: 2 }
          - { config: "8x2", shard: "4/8", workers: 2 }
          - { config: "8x2", shard: "5/8", workers: 2 }
          - { config: "8x2", shard: "6/8", workers: 2 }
          - { config: "8x2", shard: "7/8", workers: 2 }
          - { config: "8x2", shard: "8/8", workers: 2 }
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - run: pnpm exec playwright install chromium
        timeout-minutes: 2

      - run: pnpm test:e2e --shard=${{ matrix.shard }} --workers=${{ matrix.workers }}

  check:
    name: Check
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      STATIC: ${{ needs.static.result }}
      E2E: ${{ needs.e2e.result }}
    steps:
      - run: |
          echo "static: $STATIC"
          echo "end to end: $E2E"
          test "$STATIC" = success
          test "$E2E" = success
